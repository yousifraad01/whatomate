<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Whatomate - WhatsApp Business Platform">
    <title>Whatomate</title>
    <script>
      // Apply the theme class before the app mounts so light-mode users do
      // not see a flash of the dark-first stylesheet. Mirrors useColorMode.
      (function() {
        var mode;
        try { mode = localStorage.getItem('color-mode'); } catch (e) { mode = null; }
        var isDark = mode === 'dark' || (mode === 'system' || !mode) && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
