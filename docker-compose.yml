# Dokploy deployment compose — builds the app from this repo's source
# instead of pulling a published image, so local code changes ship on deploy.
#
# Service and volume names deliberately match the previously deployed stack
# so the existing Postgres, Redis and uploads volumes are reused, not recreated.
#
# config.toml is provided by Dokploy as a file mount (Advanced > Volumes),
# which lands in ../files/ relative to the cloned repo.
services:
  whatomate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Etc/UTC
    volumes:
      - ../files/config.toml:/app/config.toml:ro
      - whatomate-uploads:/app/uploads
    command: ["server", "-migrate", "-config", "/app/config.toml"]
    healthcheck:
      test: ["CMD", "./whatomate", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - whatomate-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - whatomate-redis-data:/data

volumes:
  whatomate-uploads:
  whatomate-postgres-data:
  whatomate-redis-data:
